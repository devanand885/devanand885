<svg viewBox="0 0 900 120" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <style>
      .bg { fill: #0a0f1f; }
      .dot { fill: #4cc9f0; }
      .pac { fill: #3a86ff; }
      .mouth { fill: #0a0f1f; }
      .eye { fill: #ffffff; }
      .pupil { fill: #0a0f1f; }
      .ghost-body { fill: #e63946; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="120" rx="18"/>

  <!-- dots -->
  <g>
    <circle class="dot" cx="40"  cy="60" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="0.0s"  repeatCount="indefinite"/></circle>
    <circle class="dot" cx="90"  cy="60" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="0.1s"  repeatCount="indefinite"/></circle>
    <circle class="dot" cx="140" cy="60" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="0.2s"  repeatCount="indefinite"/></circle>
    <circle class="dot" cx="190" cy="60" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="0.3s"  repeatCount="indefinite"/></circle>
    <circle class="dot" cx="240" cy="60" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="0.4s"  repeatCount="indefinite"/></circle>
    <circle class="dot" cx="290" cy="60" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="0.5s"  repeatCount="indefinite"/></circle>
    <circle class="dot" cx="340" cy="60" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="0.6s"  repeatCount="indefinite"/></circle>
    <circle class="dot" cx="390" cy="60" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="0.7s"  repeatCount="indefinite"/></circle>
    <circle class="dot" cx="440" cy="60" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="0.8s"  repeatCount="indefinite"/></circle>
    <circle class="dot" cx="490" cy="60" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="0.9s"  repeatCount="indefinite"/></circle>
    <circle class="dot" cx="540" cy="60" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="1.0s"  repeatCount="indefinite"/></circle>
    <circle class="dot" cx="590" cy="60" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="1.1s"  repeatCount="indefinite"/></circle>
    <circle class="dot" cx="640" cy="60" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="1.2s"  repeatCount="indefinite"/></circle>
    <circle class="dot" cx="690" cy="60" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="1.3s"  repeatCount="indefinite"/></circle>
    <circle class="dot" cx="740" cy="60" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="1.4s"  repeatCount="indefinite"/></circle>
    <circle class="dot" cx="790" cy="60" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="1.5s"  repeatCount="indefinite"/></circle>
    <circle class="dot" cx="840" cy="60" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="1.6s"  repeatCount="indefinite"/></circle>
  </g>

  <!-- ghost (now leads in front) -->
  <g transform="translate(-70,60)">
    <animateTransform attributeName="transform" type="translate" values="-70,60; 940,60; -70,60" keyTimes="0;0.999;1" dur="6s" begin="-0.45s" repeatCount="indefinite"/>
    <path class="ghost-body" d="M -18,10 A 18,18 0 1 1 18,10 L 18,20 L 12,14 L 6,20 L 0,14 L -6,20 L -12,14 L -18,20 Z"/>
    <circle class="eye" cx="-7" cy="2" r="5"/>
    <circle class="eye" cx="7" cy="2" r="5"/>
    <circle class="pupil" cx="-5" cy="3" r="2.3"/>
    <circle class="pupil" cx="9" cy="3" r="2.3"/>
  </g>

  <!-- pac-man (now trails behind, mouth open toward the back) -->
  <g transform="translate(-100,60)">
    <animateTransform attributeName="transform" type="translate" values="-100,60; 960,60; -100,60" keyTimes="0;0.999;1" dur="6s" begin="0s" repeatCount="indefinite"/>
    <circle class="pac" cx="0" cy="0" r="26"/>
    <path class="mouth">
      <animate attributeName="d"
        values="
          M 0,0 L 30,-14 A 26,26 0 1 1 30,14 Z;
          M 0,0 L 30,-2  A 26,26 0 1 1 30,2  Z;
          M 0,0 L 30,-14 A 26,26 0 1 1 30,14 Z"
        dur="0.35s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
